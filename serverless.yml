org: reconman
app: custom-game-area
service: custom-game-area

frameworkVersion: '4'

package:
  patterns:
    - '!*.json'
    - '!poetry.lock'
    - '!pyproject.toml'
    - '!tox.ini'
    - '!README.md'
    - '!node_modules'

custom:
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    strip: false
    layer: true

provider:
  name: aws
  runtime: python3.14
  region: eu-central-1
  memorySize: 200
  iam:
    role:
      statements:
        # The generated role grants these log-group actions only on log-stream ARNs (`...:*`), which AWS stops
        # honoring for them on 2027-04-26 (serverless/serverless#14073). Remove once Serverless grants them itself.
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:TagResource
          Resource:
            - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*
  environment:
    APP_ID: ${param:app-id}
    PRIVATE_KEY: ${param:private-key}
    WEBHOOK_SECRET: ${param:webhook-secret}

functions:
  custom-game-area:
    handler: app.lambda_handler
    timeout: 30
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      # REST API endpoint (API Gateway v1)
      - http:
          # Path for this endpoint
          path: custom-game-area
          # HTTP method for this endpoint
          method: post
