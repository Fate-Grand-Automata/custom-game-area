name: Serverless deployment

on:
  push:
    branches:
      - serverless

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/sam/build-python3.14
    steps:
    - run: |
        curl -LO https://nodejs.org/dist/v24.2.0/node-v24.2.0-linux-x64.tar.xz
        tar -xf node-v24.2.0-linux-x64.tar.xz --strip-components 1 -C /usr/local
        node -v
        npm -v
    - uses: actions/checkout@v7
    - name: Install poetry
      uses: abatilo/actions-poetry@v2
    - name: serverless deploy
      run: |
        npm i -g serverless@4.x
        npm ci
        npm list -g
        serverless deploy
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
