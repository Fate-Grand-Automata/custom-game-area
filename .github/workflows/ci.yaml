name: Serverless deployment

on:
  push:
    branches:
      - serverless

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/lambda/python:3.14
      volumes:
        - /node20217:/__e/node20:rw,rshared
    steps:
    - run: |
        yum install git curl tar xz -y
        curl -LO https://unofficial-builds.nodejs.org/download/release/v20.9.0/node-v20.9.0-linux-x64-glibc-217.tar.xz
        tar -xf node-v20.9.0-linux-x64-glibc-217.tar.xz --strip-components 1 -C /usr/local
        ln -s /usr/local/bin /__e/node20/bin
        ldd /__e/node20/bin/node
    - uses: actions/checkout@v7
    - name: Install poetry
      uses: abatilo/actions-poetry@v4
    - name: serverless deploy
      run: |
        npm i -g serverless@4.x
        npm ci
        npm list -g
        serverless deploy
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
